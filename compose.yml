name: pl-knowledge-engine-demo
services:
  neo4j:
    image: neo4j:5.26-community@sha256:d9cfe82983d27f5a75b3aaae8f316d04f9a698a3b7f6103a508f7caf8362f255
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      DEMO_DB_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - '127.0.0.1:7688:7687'
      - '127.0.0.1:7475:7474'
    volumes:
      - graph:/data
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${DEMO_DB_PASSWORD}" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  app:
    image: pl-knowledge-engine-demo:local
    build: .
    environment:
      DATA_DIR: /app/data
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GEMINI_API_KEY: ''
      YOUTUBE_API_KEY: ''
      SEASON: '2025-26'
    ports:
      - '127.0.0.1:8010:8000'
    volumes:
      - corpus:/app/data
      - index:/app/data/stores
      - models:/home/app/.cache
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health",timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  corpus:
  index:
  models:
  graph:
